# Template CI for a blog repo that depends on bear-inject. Copy into your
# repo as .github/workflows/ci.yml. Set the CLOUDFLARE_API_TOKEN secret and
# the CLOUDFLARE_ACCOUNT_ID, DOMAIN, VARS_JSON (and optionally INCLUDE_WWW,
# WORKER_NAME, FEED_PATH, PURGE_CACHE) repo variables.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DOMAIN: ${{ vars.DOMAIN }}
      VARS_JSON: ${{ vars.VARS_JSON }}
      INCLUDE_WWW: ${{ vars.INCLUDE_WWW }}
      WORKER_NAME: ${{ vars.WORKER_NAME }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Validate a full Worker build without deploying
        run: bunx bear-inject dry-run

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      DOMAIN: ${{ vars.DOMAIN }}
      WORKER_NAME: ${{ vars.WORKER_NAME }}
      INCLUDE_WWW: ${{ vars.INCLUDE_WWW }}
      VARS_JSON: ${{ vars.VARS_JSON }}
      FEED_PATH: ${{ vars.FEED_PATH }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Deploy to Cloudflare
        run: bunx bear-inject deploy
      - name: Verify the live site through the Cloudflare edge
        run: bunx bear-inject verify
      - name: Purge Cloudflare cache
        if: vars.PURGE_CACHE == 'true'
        run: bunx bear-inject purge-cache
