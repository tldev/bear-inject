name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Unit and integration tests (in workerd)
        run: bun run test
      - name: End-to-end package test (fixture consumer, CLI, wrangler dry run)
        run: bun run test:e2e
